id = "croft"
name = "Croft"
description = "Croft language support: highlighting, outline, and errors as you type through croft lsp."
version = "0.1.0"
schema_version = 1
authors = ["Bri Ward"]
repository = "https://github.com/croftlang/lang"

# The grammar lives in this repository, in editors/tree-sitter-croft. Zed
# builds it from the commit named by `rev`, so `rev` must be a pushed commit that
# contains it. For local work, see editors/zed/README.md.
[grammars.croft]
repository = "https://github.com/croftlang/lang"
rev = "fbdcc05e10dd7a46ae45a5b1dbbfc61d0bc55f48"
path = "editors/tree-sitter-croft"

# `croft lsp`, from the `croft` command on your PATH: errors as you type,
# hover and go to definition.
[language_servers.croft]
name = "Croft"
languages = ["Croft"]
