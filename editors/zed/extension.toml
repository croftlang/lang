id = "b"
name = "b"
description = "Syntax highlighting, outline and indentation for the b domain language."
version = "0.1.0"
schema_version = 1
authors = ["Bri Ward"]
repository = "https://github.com/briward/b"

# The grammar lives in this repository, in editors/tree-sitter-b. Zed builds
# it from the commit named by `rev`, so `rev` must be a pushed commit that
# contains it. For local work, see editors/zed/README.md.
[grammars.b]
repository = "https://github.com/briward/b"
rev = "main"
path = "editors/tree-sitter-b"

# `b lsp`, from the `b` command on your PATH: errors as you type, hover and
# go to definition.
[language_servers.b]
name = "b"
languages = ["b"]
