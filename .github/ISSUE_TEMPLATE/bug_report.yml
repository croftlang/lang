name: Bug Report
description: Report a bug in the compiler, the generated C or the language server
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Croft Version
      description: Which version or commit of Croft did you build from?
      placeholder: "e.g., 0.1.0, or commit c0c9009"
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Target and C Compiler
      description: Which target did you compile for, and which C compiler built the output?
      placeholder: "e.g., desktop with clang 17, spectrum_48k with z88dk"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Provide the smallest program, and its croft.toml, that reproduces the issue
      placeholder: |
        context Greeter {
          export { greet }

          // Your reproduction code here
        }
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens? Include the compiler's output, or the C compiler's errors.
      render: text
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or information that might help
