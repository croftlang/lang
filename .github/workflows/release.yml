name: Release

# Pushing a tag such as v0.1.0 builds `croft` for each platform and publishes a
# GitHub release with one archive per platform. A pull request that changes this
# file runs the builds only, so the workflow is tried before a tag needs it.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # musl links statically, so one Linux build runs on any distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The tag must name the version in Cargo.toml, so `croft version` agrees
      # with the release it came from.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked -p croft_cli --target ${{ matrix.target }}

      # Archive names leave out the version, so
      # releases/latest/download/croft-<target>.tar.gz always finds the newest.
      - name: Package
        shell: bash
        run: |
          name=croft-${{ matrix.target }}
          mkdir "$name"
          cp LICENSE-MIT LICENSE-APACHE COPYRIGHT README.md "$name/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/croft.exe "$name/"
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp target/${{ matrix.target }}/release/croft "$name/"
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi

          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      # Run the packaged binary once, where the runner can, to catch a broken build.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          printf 'domain Program {\n    calls { Console }\n} = Console.print("Hello, World")\n' > hello.croft
          ./croft-${{ matrix.target }}/croft version
          ./croft-${{ matrix.target }}/croft check hello.croft

      - uses: actions/upload-artifact@v4
        with:
          name: croft-${{ matrix.target }}
          path: |
            croft-${{ matrix.target }}.tar.gz
            croft-${{ matrix.target }}.zip
            croft-${{ matrix.target }}.*.sha256
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Croft ${GITHUB_REF_NAME#v}" \
            --generate-notes
