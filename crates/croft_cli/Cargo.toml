[package]
name = "croft_cli"
description = "The Croft command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "croft"
path = "src/main.rs"

[dependencies]
croft_std = { path = "../croft_std" }
croft_syntax = { path = "../croft_syntax" }
croft_analysis = { path = "../croft_analysis" }
croft_codegen = { path = "../croft_codegen" }
crossbeam-channel = "0.5"
lsp-server = "0.7"
lsp-types = "0.97"
serde = "1"
serde_json = "1"
